# Vercel Hobby n'autorise que des crons quotidiens : ce workflow appelle la route toutes les 15 minutes.
# Secrets du dépôt requis : APP_URL (ex. https://orvolt.fr, sans slash final) et CRON_SECRET (identique à celui de Vercel).
name: cron-notifications
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/notifications
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET" || { echo "APP_URL ou CRON_SECRET manquant"; exit 1; }
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/notifications"
